name: Kruisschakelaars
version: "0.1.1"
slug: kruisschakelaars
description: Beheer en viewer voor het ESP-NOW kruisschakelaar-netwerk (leer-modus, configuratie, MQTT)
url: https://github.com/jorissynaeve/valevinagre_kruisschakelaar
arch: [aarch64, amd64, armv7]
startup: application
boot: auto
init: false
host_network: true          # UDP-broadcast naar de bridges op het LAN
ingress: true
homeassistant_api: true  # externe apparaten (bv. Tuya) schakelen via HA
ingress_port: 8099
panel_icon: mdi:light-switch
panel_title: Kruisschakelaars
services:
  - mqtt:want
options:
  network_key: ""
  peer_id: 61440
  udp_port: 47474
  broadcast_addr: "255.255.255.255"
  peers: []
  hub: true
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  ha_url: ""
  ha_token: ""
  log_level: info
schema:
  network_key: password?
  peer_id: int(61440,65534)?
  udp_port: port?
  broadcast_addr: str?
  peers: ["str"]
  hub: bool?
  mqtt_host: str?
  mqtt_port: port?
  mqtt_user: str?
  mqtt_password: password?
  ha_url: str?
  ha_token: password?
  log_level: list(debug|info|warning|error)?
