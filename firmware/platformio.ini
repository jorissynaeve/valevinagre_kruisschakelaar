; Alleen een compileertest van de kern op echte hardware (nog geen volledige firmware).
[platformio]
src_dir = probe

[env]
framework = arduino
build_flags =
  -I../core/include
  -I../third_party/monocypher
  -Os
build_src_filter =
  +<*>
  +<../../core/src/>
  +<../../third_party/monocypher/monocypher.c>

[env:esp8285_1m]
platform = espressif8266
board = esp01_1m
board_build.flash_mode = dout
board_build.ldscript = eagle.flash.1m64.ld   ; 1 MB: ~470 KB per OTA-slot

[env:esp32]
platform = espressif32
board = esp32dev
; de kern gebruikt C++17; de ESP32-Arduino-core staat standaard op gnu++11
build_unflags = -std=gnu++11
build_flags =
  ${env.build_flags}
  -std=gnu++17
